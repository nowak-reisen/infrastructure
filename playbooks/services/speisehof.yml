---
# Deploy speisehof.de to neon.
# Source: github.com/speisehof/www (the Jekyll site stays in that repo).
#
# Builds the Jekyll site from the app checkout (speisehof_source) on the
# controller, then deploys the built _site/.
- name: Deploy speisehof.de
  hosts: neon
  become: true
  vars:
    domain: speisehof.de
  pre_tasks:
    - name: Build the Jekyll site
      ansible.builtin.command:
        cmd: bundle exec jekyll build
        chdir: "{{ speisehof_source }}"
        creates: "{{ speisehof_source }}/_site"
      delegate_to: localhost
      become: false
      tags: [local, jekyll]
  roles:
    - role: ansistrano.deploy
      vars:
        ansistrano_deploy_from: "{{ speisehof_source }}/_site"
        ansistrano_deploy_to: "/var/www/{{ domain }}"
        ansistrano_current_via: symlink
        ansistrano_deploy_via: rsync
      tags: [html, site, ansistrano]
    - role: suhlig.caddy_file_server
      vars:
        caddy_domain: "{{ domain }}"
        caddy_content_directory: "/var/www/{{ domain }}/current"
        caddy_additional_config: |
          try_files {path}.html {path}
      tags: [caddy, static, files]
