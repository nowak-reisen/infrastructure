---
# Single source of truth for the hosts this repo manages or deploys to.
#
# neon is the nowak-reisen server. This repo provisions its baseline and
# deploys every nowak-reisen / speisehof service to it (caterbill, speisehof.de,
# nowak-reisen.de). It also still serves a few uhlig-it services (uhlig.it,
# kehrkraft, uhlig.social); those are deployed by uhlig-it/infrastructure, which
# keeps its own record of the host.
#
# opus is a uhlig-it home server. It appears here only because caterbill's
# backup verification (sqlite-vault-verify) runs there. Its provisioning and
# every other service on it belong to uhlig-it/infrastructure.
all:
  children:
    servers:
      hosts:
        neon:
    # Target for playbooks/services/sqlite-vault-verify.yml. Not provisioned
    # here.
    sqlite_vault_verify:
      hosts:
        opus:
